name: Publish Mod

on:
  push:
    tags:
      - '[A-Za-z0-9]+-[0-9]+\.[0-9]+\.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine mod
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          echo "Running for tag: $TAG"

          MOD_NAME="${TAG%-*}"
          VERSION="${TAG##*-}"

          # Find the mod files
          MOD_DIR="$GITHUB_WORKSPACE/$MOD_NAME"
          PROJECT=$(find "$MOD_DIR" -maxdepth 1 -name '*.csproj' -print -quit)

          if [[ ! -d "$MOD_DIR" ]]; then
            echo "ERROR: Could not find mod directory in $MOD_DIR"
            exit 1
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: No .csproj file found in $MOD_DIR"
            exit 1
          fi

          echo "MOD_NAME=$MOD_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MOD_DIR=$MOD_DIR" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Build mod
        shell: bash
        run: |
          dotnet build "$PROJECT" \
            --configuration Release \
            -p:OutputPath="$GITHUB_WORKSPACE/build/$MOD_NAME"

            echo "Build output:"
            find "$GITHUB_WORKSPACE/build/$MOD_NAME" -type f -print

          # Verify version numbers