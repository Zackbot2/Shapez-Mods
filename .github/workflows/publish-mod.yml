name: Publish Mod

on:
  push:
    tags:
      - '/[A-Za-z0-9]+ [0-9]+\.[0-9]+\.[0-9]+/gm'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show trigger information
        shell: bash
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"